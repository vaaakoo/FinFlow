x-http-health: &http-health
  test:
    - CMD
    - bash
    - -ec
    - >-
      exec 3<>/dev/tcp/127.0.0.1/8080;
      printf 'GET /health/live HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3;
      grep -qm1 '^HTTP/1.1 200' <&3
  interval: 2s
  timeout: 3s
  retries: 30

x-api-identity: &api-identity
  Identity__Issuer: http://localhost:${FINFLOW_IDENTITY_PORT:-8082}/realms/finflow
  Identity__MetadataAddress: http://keycloak:8080/realms/finflow/.well-known/openid-configuration
  Identity__AllowHttpMetadata: "true"

services:
  portal:
    build: ./frontend
    environment:
      FINFLOW_IDENTITY_PORT: ${FINFLOW_IDENTITY_PORT:-8082}
    ports:
      - "127.0.0.1:4200:8080"
    depends_on:
      gateway:
        condition: service_healthy

  keycloak:
    image: quay.io/keycloak/keycloak:26.4.7
    command: ["start-dev", "--import-realm"]
    environment:
      KC_HOSTNAME: http://localhost:${FINFLOW_IDENTITY_PORT:-8082}
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      FINFLOW_DEMO_PASSWORD: ${FINFLOW_DEMO_PASSWORD:-finflow-local-demo}
      FINFLOW_TRANSFER_CLIENT_SECRET: ${FINFLOW_TRANSFER_CLIENT_SECRET:-finflow-local-transfer-client}
      FINFLOW_PAYMENT_CLIENT_SECRET: ${FINFLOW_PAYMENT_CLIENT_SECRET:-finflow-local-payment-client}
    ports:
      - "127.0.0.1:${FINFLOW_IDENTITY_PORT:-8082}:8080"
    volumes:
      - ./infrastructure/keycloak/finflow-realm.json:/opt/keycloak/data/import/finflow-realm.json:ro

  ledger:
    ports: !reset []
    healthcheck: *http-health
    environment:
      <<: *api-identity
      ASPNETCORE_HTTP_PORTS: ""
      Kestrel__Endpoints__Http__Url: http://+:8080
      Kestrel__Endpoints__Grpc__Url: http://+:8081
      Kestrel__Endpoints__Grpc__Protocols: Http2
      Identity__Enabled: "true"
      RabbitMq__AuditEnabled: "true"

  audit:
    healthcheck: *http-health
    build:
      context: .
      target: audit
    environment:
      <<: *api-identity
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__Audit: "Host=postgres;Database=finflow_audit;Username=finflow;Password=${FINFLOW_POSTGRES_PASSWORD:-demo-postgres}"
      RabbitMq__Uri: "amqp://finflow:${FINFLOW_RABBITMQ_PASSWORD:-demo-rabbitmq}@rabbitmq:5672/"
    depends_on:
      postgres:
        condition: service_healthy

  customers:
    healthcheck: *http-health
    build:
      context: .
      target: customers
    environment:
      <<: *api-identity
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__Customers: "Host=postgres;Database=finflow_customers;Username=finflow;Password=${FINFLOW_POSTGRES_PASSWORD:-demo-postgres}"
      RabbitMq__Uri: "amqp://finflow:${FINFLOW_RABBITMQ_PASSWORD:-demo-rabbitmq}@rabbitmq:5672/"
      ConnectionStrings__Valkey: "valkey:6379,abortConnect=false,connectRetry=0,connectTimeout=1000,asyncTimeout=1000"
    depends_on:
      postgres:
        condition: service_healthy

  valkey:
    image: valkey/valkey:8-alpine

  gateway:
    healthcheck: *http-health
    build:
      context: .
      target: gateway
    environment:
      <<: *api-identity
      ASPNETCORE_HTTP_PORTS: 8080
    ports:
      - "127.0.0.1:${FINFLOW_GATEWAY_PORT:-8081}:8080"
    depends_on:
      audit:
        condition: service_healthy
      customers:
        condition: service_healthy
      ledger:
        condition: service_healthy
      keycloak:
        condition: service_started
      transfers:
        condition: service_healthy
      payments:
        condition: service_healthy
      notifications:
        condition: service_healthy

  notifications:
    healthcheck: *http-health
    environment:
      <<: *api-identity
      ASPNETCORE_HTTP_PORTS: 8080
      Identity__Enabled: "true"
      Mail__Host: mailpit
    depends_on:
      mailpit:
        condition: service_started

  mailpit:
    image: axllent/mailpit:v1.34.0
    ports:
      - "127.0.0.1:${FINFLOW_MAIL_PORT:-8025}:8025"

  payments:
    healthcheck: *http-health
    build:
      context: .
      target: payments
    environment:
      <<: *api-identity
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__Payments: "Host=postgres;Database=finflow_payments;Username=finflow;Password=${FINFLOW_POSTGRES_PASSWORD:-demo-postgres}"
      RabbitMq__Uri: "amqp://finflow:${FINFLOW_RABBITMQ_PASSWORD:-demo-rabbitmq}@rabbitmq:5672/"
      LedgerPosting__Address: http://ledger:8081
      LedgerPosting__TokenEndpoint: http://keycloak:8080/realms/finflow/protocol/openid-connect/token
      LedgerPosting__ClientSecret: ${FINFLOW_PAYMENT_CLIENT_SECRET:-finflow-local-payment-client}
    depends_on:
      postgres:
        condition: service_healthy

  transfers:
    healthcheck: *http-health
    build:
      context: .
      target: transfers
    environment:
      <<: *api-identity
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__Transfers: "Host=postgres;Database=finflow_transfers;Username=finflow;Password=${FINFLOW_POSTGRES_PASSWORD:-demo-postgres}"
      RabbitMq__Uri: "amqp://finflow:${FINFLOW_RABBITMQ_PASSWORD:-demo-rabbitmq}@rabbitmq:5672/"
      LedgerPosting__Address: http://ledger:8081
      LedgerPosting__TokenEndpoint: http://keycloak:8080/realms/finflow/protocol/openid-connect/token
      LedgerPosting__ClientSecret: ${FINFLOW_TRANSFER_CLIENT_SECRET:-finflow-local-transfer-client}
    depends_on:
      postgres:
        condition: service_healthy
